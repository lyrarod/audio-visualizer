<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
    <title>Audio Visualizer 🎵</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="main.js" defer></script>
  </head>
  <body>
    <div class="container animation">
      <h1>Audio Visualizer</h1>

      <div id="audioContainer">
        <audio id="audio" controls></audio>
        <button id="btnVisualizer">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-audio-lines-icon lucide-audio-lines"
          >
            <path d="M2 10v3" />
            <path d="M6 6v11" />
            <path d="M10 3v18" />
            <path d="M14 8v7" />
            <path d="M18 5v13" />
            <path d="M22 10v3" />
          </svg>
          Click to Visualizer
        </button>
      </div>

      <div id="fileContainer" style="display: none" class="animation">
        <label for="file" id="labelFile">Select Audio:</label>
        <input type="file" id="file" accept="audio/*" hidden />
        <button id="btnFile">No Audio...</button>
      </div>

      <div id="badges">
        <hr id="line" />
      </div>
    </div>
    <canvas id="canvas"></canvas>
    <img src="/assets/Terrestrial_01-512x512.png" alt="" id="planet" />
  </body>
</html>
