<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
    <title>Audio Visualizer 🎵</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="script.js" defer></script>
  </head>
  <body>
    <div class="container">
      <h1>
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="28"
          height="28"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="lucide lucide-audio-lines-icon lucide-audio-lines"
        >
          <path d="M2 10v3" />
          <path d="M6 6v11" />
          <path d="M10 3v18" />
          <path d="M14 8v7" />
          <path d="M18 5v13" />
          <path d="M22 10v3" />
        </svg>
        <em>Audio Visualizer</em>
      </h1>
      <audio id="audio" controls></audio>
      <input type="file" id="file" accept="audio/*" />
      <div id="badges">
        <button id="neverbackdown">Never Back Down</button>
        <button id="spaceflight">Space Flight</button>
        <button id="overworld">Overworld</button>
        <button id="krakenofthesea">Kraken of the Sea</button>
        <button id="topgear">Top Gear: Las Vegas</button>
      </div>
    </div>
    <canvas id="canvas"></canvas>
  </body>
</html>
