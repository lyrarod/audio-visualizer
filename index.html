<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
    <title>Audio Visualizer 🎵</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="main.js" defer></script>
  </head>
  <body>
    <div class="container animation">
      <h1>Audio Visualizer</h1>

      <!-- // audio container -->
      <div id="audioContainer">
        <audio id="audio" controls></audio>

        <!-- // current audio -->
        <div id="currentAudioContainer">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-file-music-icon lucide-file-music"
          >
            <path d="M10.5 22H18a2 2 0 0 0 2-2V7l-5-5H6a2 2 0 0 0-2 2v8.4" />
            <path d="M8 18v-7.7L16 9v7" />
            <circle cx="14" cy="16" r="2" />
            <circle cx="6" cy="18" r="2" />
          </svg>
          <span id="currentAudio"></span>
        </div>

        <button id="btnVisualizer">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-audio-lines-icon lucide-audio-lines"
          >
            <path d="M2 10v3" />
            <path d="M6 6v11" />
            <path d="M10 3v18" />
            <path d="M14 8v7" />
            <path d="M18 5v13" />
            <path d="M22 10v3" />
          </svg>
          Click to Visualizer
        </button>
      </div>

      <!-- // badges -->
      <div id="badges">
        <hr id="line" />
      </div>
    </div>

    <!-- // canvas -->
    <canvas id="canvas"></canvas>

    <!-- // planet -->
    <img src="/assets/image/earth.png" alt="" id="planet" />

    <!-- // file -->
    <label for="file" id="labelFile">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="lucide lucide-upload-icon lucide-upload"
      >
        <path d="M12 3v12" />
        <path d="m17 8-5-5-5 5" />
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
      </svg>
      <input type="file" id="file" accept="audio/*" hidden />
    </label>
  </body>
</html>
